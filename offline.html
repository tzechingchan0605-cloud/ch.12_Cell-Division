const ids=['M1','P1','M2','P2'];
function chrom(id,sister=0,cross=false){const pair=+id[1],origin=id[0];return {id,pair,origin,sister,loci:[origin, cross&&pair===1&&((origin==='M'&&sister===1)||(origin==='P'&&sister===0))?(origin==='M'?'P':'M'):origin]};}
function products(kind,flips=[false,false],cross=false){if(kind==='mitosis')return [0,1].map(s=>ids.map(id=>chrom(id,s,false)));return [0,1].flatMap(pole=>[0,1].map(s=>[1,2].map((pair,i)=>chrom(`${(pole===0)!==flips[i]?'M':'P'}${pair}`,s,cross))));}
function snapshot(kind,event,flips=[false,false],cross=false){
 const replicated=event>0;
 if(event===0)return {cells:[ids.map(id=>chrom(id))],replicated:false,count:[4,4],scope:'cell',separation:null};
 if(event<4)return {cells:[ids.map(id=>chrom(id,0,kind==='meiosis'&&cross&&event>=2))],replicated,count:[4,8],scope:'cell',separation:null};
 if(kind==='mitosis')return {cells:products(kind),replicated:false,count:[4,4],scope:event===4?'pole':'daughter',separation:event===4?'sisters':null};
 if(event<7)return {cells:[0,1].map(pole=>[1,2].map((pair,i)=>chrom(`${(pole===0)!==flips[i]?'M':'P'}${pair}`,0,cross))),replicated:true,count:[2,4],scope:event===4?'pole':'daughter',separation:event===4?'homologues':null};
 return {cells:products(kind,flips,cross),replicated:false,count:[2,2],scope:event===7?'pole':'product',separation:event===7?'sisters':null};
}

en:{brand:'Cell Division Lab',eyebrow:'CH.12 / INTERACTIVE BIOLOGY',title:'Follow every chromosome',intro:'Track homologues and sister chromatids. Explore how one replication leads to two different division outcomes.',badge:'Schematic model · 2n = 4',explore:'Explore',challenge:'Guided challenge',mitosis:'Mitosis',meiosis:'Meiosis',compare:'Side-by-side',sync:'Synchronised conceptual events (not equal real time)',labels:'Labels',on:'On',off:'Off',model:'Chromosome observatory',play:'Play',pause:'Pause',step:'Next step',reset:'Reset',replay:'Replay',speed:'Playback speed (viewing only)',slow:'Slow',normal:'Normal',fast:'Fast',timeline:'Conceptual event progress',maternal:'Maternal M · solid',paternal:'Paternal P · dashed',select:'Select a chromosome to trace its homologue or sisters. Each tag is a keyboard-accessible button.',selected:'Selected',identity:'Identity',homologue:'Homologue',sister:'Sisters: s0 and s1 of the same identity (after replication)',settings:'Meiosis settings',pair:'Homologous pair',flip:'Flip orientation',random:'Randomise independently and replay',cross:'Demonstrate crossing over',alleles:'Show allele markers',locked:'Set orientation and crossing over before separation; replay to change them.',crosshelp:'Demonstration: M1-s1 and P1-s0 exchange corresponding distal segments reciprocally in pair 1. This teaching toggle isolates a concept; organisms cannot switch it off at will.',observations:'Observations & evidence',record:'Record current state',download:'Download CSV',clear:'Clear records',empty:'No records yet. Record different events to compare them.',trial:'Record',stage:'Event',counts:'Chromosomes / DNA molecules',result:'Final combinations (per product)',scope:'Counting scope',cell:'Per cell',pole:'Per pole / forming nucleus',daughter:'Per daughter cell',product:'Per final product',chromosomes:'Chromosomes',dna:'DNA molecules',ploidy:'Ploidy',diploid:'Diploid',haploid:'Haploid',repnote:'Replication increases DNA molecules from 4 to 8. Centromeres have not separated: there are still 4 chromosomes.',sistersnote:'Once sister chromatids separate, each is a chromosome. Counts here are per pole, not for the whole undivided cell.',homologuesnote:'Meiosis I separates homologous chromosomes while sister centromeres remain joined. Chromosome number is halved here.',norep:'There is no DNA replication between the two meiotic nuclear divisions.',variation:'For n = 2 without crossing over, four maternal/paternal combinations are possible across runs. One meiosis produces only a subset; it need not produce all four.',assumptions:'Model information & sources',assumptionText:'An equal-division 2D schematic: timing and lengths are not measured human data. It does not imply that human oogenesis produces four equal functional gametes. Two matching loci carry M/P origin markers for tracing only, without linkage calculations. Spindle fibres indicate direction. Daughter-cell formation summarises nuclear re-formation and cytoplasmic division.',source:'Implemented from the supplied chapter 12 specification and bilingual glossary. te_12_c.pdf was not supplied; printed pages 12-3–12-20 and textbook figures have not been inspected. EDB documents have not been independently checked; this tool does not claim page-by-page curriculum certification.',glossary:'Bilingual glossary',stages:['Interphase: before replication','Interphase: after DNA replication','Arrangement and pairing','Pre-separation arrangement','First nuclear division: separation','First division complete','Before division II (no replication)','Second nuclear division: separation','Final products'],mitStages:['Interphase: before replication','Interphase: after DNA replication','Individual chromosome arrangement','Pre-separation arrangement','Sister chromatids separate','Two daughter cells','Two daughter cells','Two daughter cells','Final products'],guide:'Predict → operate → observe → explain',predict:'Predict first, then test with the model.',check:'Submit prediction',reveal:'Reveal explanation',hint:'Step-by-step hint',explain:'Explain your observations in your own words (no automated keyword grading)',attempt:'Your prediction is recorded. Operate the model, then compare with this explanation.',qnext:'Next challenge',questions:[['How are M1 and P1 related?',['Homologous chromosomes','Sister chromatids'],'They are homologues of matching length and gene positions, from different parents. M1-s0 and M1-s1 are sisters.','Select M1 and examine P1 and the sister labels.'],['After DNA replication, how many chromosomes are in each cell?',['4','8'],'4 chromosomes and 8 DNA molecules. Count by centromeres: replication does not double chromosome number.','Compare the counts before and after replication.'],['What separates in meiosis I?',['Homologous chromosomes','Sister chromatids'],'I separates homologues; II and mitosis separate sisters. After I, each cell has 2 chromosomes and 4 DNA molecules.','Step through the first and second separation events.'],['What are the final products of meiosis?',['Four haploid products','Two diploid daughter cells'],'Meiosis produces four haploid products (2 chromosomes each); mitosis produces two diploid daughters (4 each).','Use side-by-side comparison at the final event.'],['Which process creates new segment combinations?',['Crossing over between non-sister chromatids','Another DNA replication'],'Crossing over exchanges corresponding segments reciprocally. Independent assortment also varies parental combinations. No replication occurs before meiosis II.','Enable crossing over and allele markers, then compare products.']],footer:'Cell Division Lab · No account required · Models run locally',noRecords:'No records to export',orientation:'Orientation',crossCSV:'Crossing over',time:'Playback progress (schematic event)'}};

let lang;try{lang=localStorage.getItem('cell-language')}catch{}if(!dict[lang])lang='zh';
const s={kind:'meiosis',event:0,flips:[false,false],cross:false,labels:true,alleles:false,compare:false,mode:'explore',playing:false,speed:1200,selected:null,records:[],q:0,choice:null,attempt:false,hint:0,reveal:false,response:''};
let timer;const t=k=>dict[lang][k],esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(id,key,active=false)=>`<button id="${id}" class="${active?'active':''}">${t(key)}</button>`;
const stage=(kind,e)=>t(kind==='mitosis'?'mitStages':'stages')[e];
const colour=o=>o==='M'?'#b65e45':'#437da1';
function strand(c,x,y,len,offset=0,cross=false){const a=chrom(c.id,c.sister,cross),dash=a.origin==='P'?'6 3':'';return `<path d="M ${x+offset} ${y-len/2} Q ${x-offset} ${y} ${x+offset} ${y+len/2}" fill="none" stroke="${colour(a.origin)}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${dash}"/>${a.loci[1]!==a.origin?`<path d="M ${x} ${y+len*.2} L ${x+offset} ${y+len/2}" stroke="${colour(a.loci[1])}" stroke-width="7" stroke-dasharray="${a.loci[1]==='P'?'6 3':''}"/>`:''}${s.alleles?`<text x="${x+offset+5}" y="${y-len*.24}" class="svgtext">${a.loci[0]}a</text><text x="${x+offset+5}" y="${y+len*.42}" class="svgtext">${a.loci[1]}b</text>`:''}`}
function drawing(kind){const snap=snapshot(kind,s.event,s.flips,s.cross),n=snap.cells.length;let parts='';const height=n===4?430:320;const positions=n===1?[[300,150]]:n===2?[[155,150],[445,150]]:[[155,112],[445,112],[155,320],[445,320]];
 if(snap.separation)parts+=`<rect x="10" y="8" width="580" height="${height-16}" rx="100" fill="#edf5ef" stroke="#9bbdaf" stroke-dasharray="6 4"/>`;
 snap.cells.forEach((cell,i)=>{const [cx,cy]=positions[i],rx=n===1?265:133,ry=n===4?94:125;parts+=`<ellipse class="cell" stroke-dasharray="${snap.separation?'5 4':''}" cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
 cell.forEach((c,j)=>{let x,y=cy;const pairing=kind==='meiosis'&&s.event>=2&&s.event<=3;
 if(n===1){x=pairing?(c.pair===1?180:420)+((c.origin==='M')!==s.flips[c.pair-1]?-27:27):125+j*115;}else x=cx+(j-(cell.length-1)/2)*(cell.length===4?53:92);
 const len=c.pair===1?90:60;const exchange=kind==='meiosis'&&s.cross&&s.event>=2;let related=s.selected&&s.selected[1]===c.id[1],selected=s.selected===c.id;
 parts+=`<g class="chromosome ${selected?'selected':related?'related':''}" tabindex="0" role="button" data-chrom="${c.id}" aria-label="${esc(t('identity')+' '+c.id+'; '+t('homologue')+' '+(c.origin==='M'?'P':'M')+c.pair)}">`;
 if(s.event===3||s.event===4||s.event===7)parts+=`<path d="M ${cx} ${cy-ry+12} L ${x} ${y} L ${cx} ${cy+ry-12}" stroke="#b5cec3" stroke-width="1" fill="none"/>`;
 if(snap.replicated){parts+=strand({...c,sister:0},x-5,y,len,-12,exchange)+strand({...c,sister:1},x+5,y,len,12,exchange);}else parts+=strand(c,x,y,len,0,exchange);
 parts+=`<circle cx="${x}" cy="${y}" r="4" fill="#253f45"/>`;
 if(s.labels)parts+=`<text text-anchor="middle" x="${x}" y="${y+len/2+20}" class="svgtext">${c.id}${snap.replicated?' s0·s1':' s'+c.sister}</text>`;
 parts+='</g>';
 });
 });
 return `<div class="model"><h3>${t(kind)}</h3><svg viewBox="0 0 600 ${height}" role="group" aria-label="${esc(t(kind)+' — '+stage(kind,s.event))}">${parts}</svg><div class="count"><span><strong>${snap.count[0]}</strong> ${t('chromosomes')}</span><span><strong>${snap.count[1]}</strong> ${t('dna')}</span><span>${t(snap.scope)} · ${t(kind==='meiosis'&&s.event>=4?'haploid':'diploid')}</span></div></div>`;
}
function note(){if(s.event===1)return t('repnote');if(s.event===4&&s.kind==='meiosis')return t('homologuesnote');if((s.event===4&&s.kind==='mitosis')||s.event===7&&s.kind==='meiosis')return t('sistersnote');if(s.event>=5&&s.kind==='meiosis')return t('norep')+' '+t('variation');return t('select');}
function render(){document.documentElement.lang=lang==='zh'?'zh-Hant':'en-GB';document.title=t('brand');document.getElementById('brand').textContent=t('brand');['zh','en'].forEach(l=>{document.getElementById(l).classList.toggle('active',l===lang);document.getElementById(l).setAttribute('aria-pressed',l===lang)});
 const q=t('questions')[s.q];
 document.getElementById('app').innerHTML=`<div class="intro"><div><div class="eyebrow">${t('eyebrow')}</div><h1>${t('title')}</h1><p>${t('intro')}</p></div><span class="pill">${t('badge')}</span></div><nav class="toolbar" aria-label="${t('model')}">${btn('explore','explore',s.mode==='explore')}${btn('challenge','challenge',s.mode==='challenge')}<span style="flex:1"></span>${btn('mitosis','mitosis',s.kind==='mitosis')}${btn('meiosis','meiosis',s.kind==='meiosis')}${btn('compare','compare',s.compare)}</nav>
 <div class="layout"><section class="card"><div class="cardhead"><h2>${t('model')}</h2><button id="labels" aria-pressed="${s.labels}">${t('labels')}: ${t(s.labels?'on':'off')}</button></div><div class="stage"><small>${String(s.event+1).padStart(2,'0')} / 09</small> <b>${stage(s.kind,s.event)}</b></div>${s.compare?`<div class="muted" style="padding:0 20px">${t('sync')}</div>`:''}<div class="modelgrid ${s.compare?'compare':''}">${s.compare?drawing('mitosis')+drawing('meiosis'):drawing(s.kind)}</div><div class="legend"><span><i class="dot"></i>${t('maternal')}</span><span><i class="dot p"></i>${t('paternal')}</span><span>● ${terms[5][lang==='zh'?0:1]}</span></div><div class="notice">${note()}</div><div class="transport"><div class="row">${btn('play',s.playing?'pause':'play',s.playing)}${btn('step','step')}${btn('replay','replay')}${btn('reset','reset')}<label for="speed" class="muted">${t('speed')}</label><select id="speed"><option value="2200" ${s.speed===2200?'selected':''}>${t('slow')}</option><option value="1200" ${s.speed===1200?'selected':''}>${t('normal')}</option><option value="650" ${s.speed===650?'selected':''}>${t('fast')}</option></select></div><input id="timeline" type="range" min="0" max="8" step="1" value="${s.event}" aria-label="${t('timeline')}"/><div class="events"><span>${t('stages')[0]}</span><span>${t('stages')[4]}</span><span>${t('stages')[8]}</span></div></div></section>
 <aside class="sidebar"><section class="card panel"><h2>${t('settings')}</h2>${[0,1].map(i=>`<div class="control"><label>${t('pair')} ${i+1} <b>${s.flips[i]?'P | M':'M | P'}</b></label><button id="flip${i}" ${s.event>=4?'disabled':''}>↔ ${t('flip')}</button></div>`).join('')}<div class="control"><label><input id="cross" type="checkbox" ${s.cross?'checked':''} ${s.event>=4?'disabled':''}>${t('cross')}</label></div><div class="control"><label><input id="alleles" type="checkbox" ${s.alleles?'checked':''}>${t('alleles')}</label></div>${btn('random','random')}<p>${t('locked')}</p><details><summary>${t('cross')}</summary><p>${t('crosshelp')}</p></details></section><section class="card panel"><h2>${t('selected')}</h2><p>${s.selected?`${t('identity')}: <b>${s.selected}</b><br>${t('homologue')}: <b>${s.selected[0]==='M'?'P':'M'}${s.selected[1]}</b><br>${t('sister')}`:t('select')}</p></section></aside></div>
 <div class="below"><section class="card panel"><h2>${t('observations')}</h2><div class="row">${btn('record','record')}${btn('download','download')}${btn('clear','clear')}</div>${s.records.length?`<div class="scroll"><table><thead><tr><th>${t('trial')}</th><th>${t('stage')}</th><th>${t('counts')}</th><th>${t('result')}</th></tr></thead><tbody>${s.records.map((r,i)=>`<tr><td>${i+1}<br>${t(r.kind)}<br>${t('crossCSV')}: ${t(r.cross?'on':'off')}<br>${r.flips.map(x=>x?'P|M':'M|P').join(' / ')}</td><td>${stage(r.kind,r.event)}</td><td>${r.snap.count.join(' / ')}<br>${t(r.snap.scope)}</td><td>${r.event===8?r.snap.cells.map(c=>c.map(a=>`${a.id}-s${a.sister} [${a.loci.join('·')}]`).join(' + ')).join('<br>'):'—'}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">${t('empty')}</p>`}</section>
 <section class="card panel" ${s.mode!=='challenge'?'hidden':''}><div class="eyebrow">${s.q+1} / 5</div><h2>${t('guide')}</h2><h3>${q[0]}</h3><p>${t('predict')}</p><div class="qoptions">${q[1].map((a,i)=>`<button data-choice="${i}" class="${s.choice===i?'active':''}">${a}</button>`).join('')}</div><div class="row">${btn('check','check')}${btn('hint','hint')}${btn('reveal','reveal')}</div>${s.hint?`<p class="notice">${q[3]}${s.hint>1?' '+t('predict'):''}</p>`:''}${s.attempt||s.reveal?`<div class="feedback">${s.attempt?t('attempt')+'<br>':''}${q[2]}</div>`:''}<label for="response"><p>${t('explain')}</p></label><textarea id="response">${esc(s.response)}</textarea>${btn('qnext','qnext')}</section></div>
 <section class="card panel" style="margin-top:20px"><details><summary>${t('assumptions')}</summary><p>${t('assumptionText')}</p><p>${t('source')}</p><p>${t('crosshelp')}</p><p>${t('variation')}</p></details><details style="margin-top:12px"><summary>${t('glossary')}</summary><div class="terms">${terms.map(a=>`<span>${a[lang==='zh'?0:1]} — ${a[lang==='zh'?1:0]}</span>`).join('')}</div></details></section><footer>${t('footer')}</footer>`;
 bind();}
function stop(){s.playing=false;clearInterval(timer)}
function tick(){if(s.event>=8){stop();render();return}s.event++;if(s.event===8)stop();render()}
function start(){stop();if(s.event===8)s.event=0;s.playing=true;timer=setInterval(tick,s.speed)}
function csv(){if(!s.records.length)return;const rows=[[t('trial'),t('mitosis')+'/'+t('meiosis'),t('stage'),t('scope'),t('chromosomes'),t('dna'),t('orientation'),t('crossCSV'),t('result')],...s.records.map((r,i)=>[i+1,t(r.kind),stage(r.kind,r.event),t(r.snap.scope),...r.snap.count,r.flips.map(x=>x?'P|M':'M|P').join(';'),t(r.cross?'on':'off'),JSON.stringify(r.snap.cells)])];const blob=new Blob(['\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=lang==='zh'?'細胞分裂觀察.csv':'cell-division-observations.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function bind(){const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=()=>{fn();render()}};['explore','challenge'].forEach(m=>on(m,()=>s.mode=m));['mitosis','meiosis'].forEach(k=>on(k,()=>s.kind=k));on('compare',()=>s.compare=!s.compare);on('labels',()=>s.labels=!s.labels);on('play',()=>s.playing?stop():start());on('step',()=>{stop();tick()});on('replay',()=>{stop();s.event=0});on('reset',()=>{stop();Object.assign(s,{event:0,flips:[false,false],cross:false,selected:null})});on('random',()=>{stop();s.flips=[Math.random()<.5,Math.random()<.5];s.event=0});[0,1].forEach(i=>on('flip'+i,()=>s.flips[i]=!s.flips[i]));on('record',()=>s.records.push(structuredClone({kind:s.kind,event:s.event,flips:s.flips,cross:s.kind==='meiosis'&&s.cross,snap:snapshot(s.kind,s.event,s.flips,s.cross),elapsedEvent:s.event,selection:s.selected})));on('clear',()=>s.records=[]);on('download',csv);on('check',()=>{if(s.choice!==null)s.attempt=true});document.getElementById('check').disabled=s.choice===null;document.getElementById('download').disabled=!s.records.length;on('hint',()=>s.hint++);on('reveal',()=>s.reveal=true);on('qnext',()=>{s.q=(s.q+1)%5;Object.assign(s,{choice:null,attempt:false,reveal:false,hint:0,response:''})});document.getElementById('response').oninput=e=>s.response=e.target.value;document.getElementById('timeline').oninput=e=>{stop();s.event=+e.target.value;render()};document.getElementById('speed').onchange=e=>{s.speed=+e.target.value;if(s.playing)start();render()};['cross','alleles'].forEach(k=>document.getElementById(k).onchange=e=>{s[k]=e.target.checked;render()});document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{s.choice=+el.dataset.choice;render()});document.querySelectorAll('[data-chrom]').forEach(el=>{const choose=()=>{s.selected=el.dataset.chrom;render()};el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}});}
['zh','en'].forEach(l=>document.getElementById(l).onclick=()=>{lang=l;try{localStorage.setItem('cell-language',l)}catch{}render()});
render();
</script></body></html>
