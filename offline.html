const ids=['M1','P1','M2','P2'];
function chrom(id,sister=0,cross=false){const pair=+id[1],origin=id[0];return {id,pair,origin,sister,loci:[origin, cross&&pair===1&&((origin==='M'&&sister===1)||(origin==='P'&&sister===0))?(origin==='M'?'P':'M'):origin]};}
function products(kind,flips=[false,false],cross=false){if(kind==='mitosis')return [0,1].map(s=>ids.map(id=>chrom(id,s,false)));return [0,1].flatMap(pole=>[0,1].map(s=>[1,2].map((pair,i)=>chrom(`${(pole===0)!==flips[i]?'M':'P'}${pair}`,s,cross))));}
function snapshot(kind,event,flips=[false,false],cross=false){
 const replicated=event>0;
 if(event===0)return {cells:[ids.map(id=>chrom(id))],replicated:false,count:[4,4],scope:'cell',separation:null};
 if(event<4)return {cells:[ids.map(id=>chrom(id,0,kind==='meiosis'&&cross&&event>=2))],replicated,count:[4,8],scope:'cell',separation:null};
 if(kind==='mitosis')return {cells:products(kind),replicated:false,count:[4,4],scope:event===4?'pole':'daughter',separation:event===4?'sisters':null};
 if(event<7)return {cells:[0,1].map(pole=>[1,2].map((pair,i)=>chrom(`${(pole===0)!==flips[i]?'M':'P'}${pair}`,0,cross))),replicated:true,count:[2,4],scope:event===4?'pole':'daughter',separation:event===4?'homologues':null};
 return {cells:products(kind,flips,cross),replicated:false,count:[2,2],scope:event===7?'pole':'product',separation:event===7?'sisters':null};
}

// count = [chromosomes, DNA molecules]. "chromatids" counts only joined
// sister chromatids, matching the user's annotated reference convention.
function countsAt(kind,position){
 const p=Math.max(0,Math.min(8,position));
 if(p===0)return {count:[4,4],chromatids:0,notation:'2n = 4',perPole:null};
 if(p<1)return {count:[4,'4 → 8'],chromatids:'0 → 8',notation:'2n = 4',perPole:null};
 if(p<=3)return {count:[4,8],chromatids:8,notation:'2n = 4',perPole:null};
 if(kind==='mitosis')return p<5?{count:[8,8],chromatids:0,notation:'8',perPole:{count:[4,4],chromatids:0,notation:'2n = 4'}}:{count:[4,4],chromatids:0,notation:'2n = 4',perPole:null};
 if(p<5)return {count:[4,8],chromatids:8,notation:'2n = 4',perPole:{count:[2,4],chromatids:4,notation:'n = 2'}};
 if(p<=6)return {count:[2,4],chromatids:4,notation:'n = 2',perPole:null};
 if(p<8)return {count:[4,4],chromatids:0,notation:'4',perPole:{count:[2,2],chromatids:0,notation:'n = 2'}};
 return {count:[2,2],chromatids:0,notation:'n = 2',perPole:null};
}

// Positions are schematic. Every chromatid retains the same key for the entire run.
const clamp = value => Math.max(0, Math.min(1, value));
const ease = value => { const t = clamp(value); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => a + (b - a) * t;
const advancePosition = (position, elapsed, duration) => Math.min(8, position + Math.max(0, elapsed) / duration);

function keyframe(kind, event, flips) {
  return ids.flatMap((id, index) => [0, 1].map(sister => {
    const pair = Number(id[1]);
    const pole = (id[0] === 'M') !== flips[pair - 1] ? 0 : 1;
    const length=pair===1?72:48;
    let x = [155,180,420,395][index], y = [135,300,135,300][index];
    const bend = event === 0 ? 0 : (sister === 0 ? -13 : 13);
    let topX=bend,topY=-length/2,bottomX=bend,bottomY=length/2;
    const opacity = event === 0 && sister === 1 ? 0 : 1;
    if (event >= 2) {
      x = kind === 'meiosis' ? (pair===1?200:400) : 125+index*115;
      y = kind === 'meiosis' ? 220+(pole===0?-25:25) : 220;
    }
    if (event >= 4) {
      y = kind === 'meiosis' ? (pole === 0 ? 115 : 325) : (sister === 0 ? 115 : 325);
      if(kind==='mitosis') {
        // The centromere leads; both arms trail towards the equator.
        const arm=length/(2*Math.sqrt(2));
        topX=-arm;bottomX=arm;topY=bottomY=sister===0?arm:-arm;
        if(event>=5){topX=bottomX=0;topY=-length/2;bottomY=length/2;}
      }
    }
    if (event >= 6 && kind === 'meiosis') {
      x=300;y=(pole===0?115:325)+(pair===1?-44:44);
    }
    if (event >= 7 && kind === 'meiosis') {
      x=sister===0?155:445;
      const arm=length/(2*Math.sqrt(2));
      topX=bottomX=sister===0?arm:-arm;topY=-arm;bottomY=arm;
    }
    if(event>=8&&kind==='meiosis') {
      x+=(pair===1?-39:39);y=pole===0?115:325;
      topX=bottomX=0;topY=-length/2;bottomY=length/2;
    }
    // Rotate the metaphase X so the sister chromatids face the two poles.
    // Our first spindle is vertical (the textbook diagram may be rotated).
    if(event>=2&&event<=3 || kind==='meiosis'&&event>=4&&event<=5) {
      [topX,topY]=[-topY,topX];[bottomX,bottomY]=[-bottomY,bottomX];
    }
    return {key: `${id}-s${sister}`, id, sister, pair, origin: id[0], x, y,
      length, topX,topY,bottomX,bottomY,opacity};
  }));
}

// Keep arm lengths constant while changing their orientation.
function interpolateStrand(a,b,t) {
  const result={...a};
  for(const key of ['x','y','topX','topY','bottomX','bottomY','opacity'])result[key]=mix(a[key],b[key],t);
  for(const arm of ['top','bottom']) {
    const size=Math.hypot(result[arm+'X'],result[arm+'Y']);
    result[arm+'X']*=a.length/2/size;result[arm+'Y']*=a.length/2/size;
  }
  return result;
}

// Sample the membrane itself, so the cleavage furrow narrows continuously.
function boundary(cx, cy, rx, ry, pinch = 0, vertical = false) {
  const points = Array.from({length: 97}, (_, i) => {
    const a = i / 96 * Math.PI * 2;
    let dx = rx * Math.cos(a), dy = ry * Math.sin(a);
    const axis = vertical ? dy / ry : dx / rx;
    const neck = 1 - pinch * Math.exp(-Math.pow(axis / .24, 2));
    if (vertical) dx *= neck; else dy *= neck;
    return `${i ? 'L' : 'M'} ${(cx + dx).toFixed(3)} ${(cy + dy).toFixed(3)}`;
  });
  return points.join(' ') + ' Z';
}
function membranesAt(kind, position) {
  const growth = ease(Math.min(position, 1));
  const first = ease(position - 4);
  const second = kind === 'meiosis' ? ease(position - 7) : 0;
  const fadeFirst = ease((first - .78) / .22),fadeSecond = ease((second - .78) / .22);
  const membranes = [{key:'parent', path:boundary(300,220,mix(260,280,growth),mix(182,195,growth),first,true), opacity:1-fadeFirst}];
  [115,325].forEach((cy, i) => {
    membranes.push({key:`daughter-${i}`, path:boundary(300,cy,280,90,second), opacity:fadeFirst*(1-fadeSecond)});
    [155,445].forEach((cx,j) => membranes.push({key:`product-${i}-${j}`,path:boundary(cx,cy,132,90),opacity:fadeSecond}));
  });
  return membranes;
}

function nucleiAt(kind,p) {
  const first=ease((p-4)/.3)*(kind==='meiosis'?1-ease((p-5)/.45):1);
  const second=kind==='meiosis'?ease((p-7)/.3):0;
  return [{key:'parent-nucleus',path:boundary(300,220,245,165),opacity:1-ease(p-1)},...[115,325].flatMap((cy,i)=>[
    {key:`first-${i}`,path:boundary(300,cy,248,67),opacity:first},
    ...[155,445].map((cx,j)=>({key:`second-${i}-${j}`,path:boundary(cx,cy,110,65),opacity:second}))
  ])];
}

function equatorsAt(kind,p) {
  return [
    {key:'first',x1:45,y1:220,x2:555,y2:220,labelX:545,labelY:180,opacity:ease((p-1.7)/.3)*(1-ease((p-3)/.35))},
    ...[115,325].map((cy,i)=>({key:`second-${i}`,x1:300,y1:cy-85,x2:300,y2:cy+85,labelX:330,labelY:cy-70,opacity:kind==='meiosis'?ease((p-5.45)/.55)*(1-ease((p-6)/.35)):0}))
  ];
}

function sceneAt(kind, position, flips = [false,false], crossing = false) {
  const p = Math.max(0, Math.min(8, position));
  const event = Math.min(7, Math.floor(p)), progress = p - event;
  // Pair homologues first, then exchange corresponding distal segments.
  const exchange = kind === 'meiosis' && crossing && event === 1;
  const fraction = ease(exchange ? progress / .65 : progress);
  const before = keyframe(kind, event, flips), after = keyframe(kind, event + 1, flips);
  const strands = before.map((a,i) => {
    const strand=interpolateStrand(a,after[i],fraction);
    // When a homologous pair flips, route its members around each other rather
    // than through each other. Pairing alone must never look like crossing over.
    if(kind==='meiosis'&&event===1&&flips.some(Boolean)){

// Phase names are navigation aids for the continuous schematic, not timing data.
function phaseAt(kind, position) {

  if(p<=4)return {key:'anaphase',division:kind==='meiosis'?'I':''};
  if(p<4.35)return {key:'telophase',division:kind==='meiosis'?'I':''};
  if(p<5)return {key:'cytokinesis',division:kind==='meiosis'?'I':''};

  if(p<8)return {key:'cytokinesis',division:'II'};

function phaseSource(kind,position) {

}

function bind(){const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=()=>{fn();render()}};['explore','challenge'].forEach(m=>on(m,()=>s.mode=m));['mitosis','meiosis'].forEach(k=>on(k,()=>s.kind=k));on('compare',()=>s.compare=!s.compare);on('labels',()=>s.labels=!s.labels);on('play',()=>s.playing?stop():start());on('step',step);on('replay',()=>{stop();s.event=0;s.position=0});on('reset',()=>{stop();Object.assign(s,{event:0,position:0,flips:[false,false],cross:false,selected:null})});on('random',()=>{stop();s.flips=[Math.random()<.5,Math.random()<.5];s.event=0;s.position=0});[0,1].forEach(i=>on('flip'+i,()=>s.flips[i]=!s.flips[i]));on('record',()=>s.records.push(structuredClone({kind:s.kind,event:s.event,position:s.position,frame:sceneAt(s.kind,s.position,s.flips,s.cross),counting:countsAt(s.kind,s.position),flips:s.flips,cross:s.kind==='meiosis'&&s.cross,snap:snapshot(s.kind,s.event,s.flips,s.cross),elapsedEvent:s.position,selection:s.selected})));on('clear',()=>s.records=[]);on('download',csv);on('check',()=>{if(s.choice!==null)s.attempt=true});document.getElementById('check').disabled=s.choice===null;document.getElementById('download').disabled=!s.records.length;on('hint',()=>s.hint++);on('reveal',()=>s.reveal=true);on('qnext',()=>{s.q=(s.q+1)%5;Object.assign(s,{choice:null,attempt:false,reveal:false,hint:0,response:''})});document.getElementById('response').oninput=e=>s.response=e.target.value;document.getElementById('timeline').oninput=e=>{stop();s.position=+e.target.value;paint()};document.getElementById('speed').onchange=e=>{s.speed=+e.target.value;paint()};['cross','alleles','reduced'].forEach(k=>document.getElementById(k).onchange=e=>{s[k]=e.target.checked;render()});document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{s.choice=+el.dataset.choice;render()});document.querySelectorAll('[data-chrom]').forEach(el=>{const choose=()=>{s.selected=el.dataset.chrom;render()};el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}});}
['zh','en'].forEach(l=>document.getElementById(l).onclick=()=>{lang=l;try{localStorage.setItem('cell-language',l)}catch{}render()});
render();
document.addEventListener('visibilitychange',()=>{previousTime=null;});

window.addEventListener('resize',()=>document.querySelectorAll('svg[data-kind]').forEach(fitAnnotations));

</script></body></html>
